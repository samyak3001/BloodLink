version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: bloodlink-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bloodlink
    volumes:
      - mongo-data:/data/db
    networks:
      - bloodlink-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Express API & Socket Gateway
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bloodlink-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/bloodlink
      JWT_SECRET: production_super_secure_jwt_secret_key_bloodlink_2026_min32chars
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bloodlink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend Nginx Web Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bloodlink-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bloodlink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  bloodlink-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
